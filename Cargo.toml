[workspace]
resolver = "2"
members = ["crates/lembar-core", "src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["Abdurrahman Trimanto"]
repository = "https://github.com/haloabdur/custom-pdf"
rust-version = "1.90"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
